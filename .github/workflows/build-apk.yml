name: Build Android APK (حساباتی خۆم)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Keystore and Environment
        run: |
          chmod +x gradlew
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Output Directory
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Hesabati-Xom-app-debug.apk
          echo "APK successfully built:"
          ls -lh output/Hesabati-Xom-app-debug.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hesabati-Xom-app-debug
          path: output/Hesabati-Xom-app-debug.apk
          retention-days: 60
